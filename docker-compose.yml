services:
  bitcoind:
    extends:
      file: bitcoind/docker-compose.yml
      service: bitcoind

  lnd:
    extends:
      file: lnd/docker-compose.yml
      service: lnd

  ord:
    extends:
      file: ord/docker-compose.yml
      service: ord

  nginx-proxy:
    extends:
      file: nginx-proxy/docker-compose.yml
      service: nginx-proxy

  nipple-05:
    extends:
      file: nipple-05/docker-compose.yml
      service: nipple-05

volumes:
  bitcoin:
    driver: local

  lnd:
    driver: local

networks:
  bitcoin:
    driver: bridge

  web:
    driver: bridge
